name: ci

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

env:
  NODE_VERSION: 20
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Typecheck Addon
        run: pnpm lint:types

  test:
    name: Tests
    needs: [typecheck]
    uses: upfluence/actions/.github/workflows/any-js-ember-test.yml@master
    secrets: inherit
    with:
      ember-try-working-directory: packages/test-app
      test-variants: |
        [{ "name": "default", "command": "pnpm -w test:ci" }]

  release:
    name: Release Package
    runs-on: ubuntu-24.04
    if: contains(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, test]
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - run: pnpm publish --no-git-checks
        working-directory: packages/hyperevents

  deploy:
    name: Deploy preview app
    runs-on: ubuntu-24.04
    needs: [typecheck, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: upfluence/actions/setup-js@master
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ vars.PNPM_VERSION }}
      - name: Build Addon
        run: pnpm --filter @upfluence/hyperevents build
      - name: Build Test App
        run: pnpm --filter test-app build
      - name: Deploy website
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/test-app/dist/
