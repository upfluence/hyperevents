name: ci

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

env:
  NODE_VERSION: 20
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: webfactory/ssh-agent@v0.5.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ vars.PNPM_VERSION }}'
      - uses: actions/setup-node@v3
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: Build Addon
        run: pnpm --filter @upfluence/hyperevents build
      - name: Lint
        run: pnpm lint
      - name: Typecheck Addon
        run: pnpm lint:types

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            command: pnpm test:ember
          - name: next
            command: pnpm ember try:one ember-4.12
    steps:
      - uses: webfactory/ssh-agent@v0.5.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ vars.PNPM_VERSION }}'
      - uses: actions/setup-node@v3
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: Build Addon
        run: pnpm --filter @upfluence/hyperevents build
      - name: Run ${{ matrix.name }} scenario
        run: ${{ matrix.command }}
        working-directory: packages/test-app
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

  release:
    name: Release Package
    runs-on: ubuntu-24.04
    if: contains(github.ref, 'refs/tags/v')
    needs: [lint, tests]
    steps:
      - uses: webfactory/ssh-agent@v0.5.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ vars.PNPM_VERSION }}'
      - uses: actions/setup-node@v3
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      - run: pnpm publish --no-git-checks
        working-directory: packages/hyperevents

  deploy:
    name: Deploy preview app
    runs-on: ubuntu-24.04
    needs: [lint, tests]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: webfactory/ssh-agent@v0.5.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ vars.PNPM_VERSION }}'
      - uses: actions/setup-node@v3
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: Build Addon
        run: pnpm --filter @upfluence/hyperevents build
      - name: Build Test App
        run: pnpm --filter test-app build
      - name: Deploy website
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packages/test-app/dist/
